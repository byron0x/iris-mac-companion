name: Verify Mac companion
on: [push, pull_request]
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify browser companion permissions and disclosure boundaries
        run: node --test browser-extension/tests/*.test.mjs
      - name: Package browser store submission
        run: python3 browser-extension/package.py
      - name: Verify encryption and reversible cleanup with temporary fixtures
        run: |
          swift build --product IRISCoreChecks
          check_binary="$(swift build --show-bin-path)/IRISCoreChecks"
          # Sign the runner's test executable, as in the signed-release checks.
          codesign --force --sign - "$check_binary"
          codesign --verify --strict --verbose=2 "$check_binary"
          "$check_binary"
      - name: Build native application
        run: swift build --product IRISCompanion
