name: Verify signed Mac download
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft or public release tag
        required: true
        default: v0.1.0
      sha256:
        description: Expected SHA-256 of the notarized ZIP
        required: true
permissions:
  contents: read
jobs:
  download:
    # GitHub exposes draft releases only to tokens with repository write access.
    # This manual job only reads assets; do not persist that token in the checkout.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      EXPECTED_SHA256: ${{ inputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download the exact release archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$EXPECTED_SHA256" =~ ^[a-f0-9]{64}$ ]]
          mkdir -p dist
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "IRIS-Mac-${RELEASE_TAG#v}.zip" --dir dist
          printf '%s  %s\n' "$EXPECTED_SHA256" "dist/IRIS-Mac-${RELEASE_TAG#v}.zip" | shasum -a 256 --check
          python3 scripts/verify-archive.py "dist/IRIS-Mac-${RELEASE_TAG#v}.zip"
          ditto -x -k "dist/IRIS-Mac-${RELEASE_TAG#v}.zip" dist
      - name: Check Apple trust and both supported architectures
        run: python3 scripts/verify-distribution.py 'dist/IRIS Mac Companion.app' --team-id CDA39J55GH --version "${RELEASE_TAG#v}"
      - name: Verify ordinary ZIP extraction too
        run: |
          mkdir -p dist/ordinary-extraction
          unzip -q "dist/IRIS-Mac-${RELEASE_TAG#v}.zip" -d dist/ordinary-extraction
          python3 scripts/verify-distribution.py 'dist/ordinary-extraction/IRIS Mac Companion.app' --team-id CDA39J55GH --version "${RELEASE_TAG#v}"
      - name: Exercise the downloaded scanner with harmless fixtures
        run: python3 scripts/verify-engine.py
      - name: Check local trust against changed fixture files
        run: '"dist/IRIS Mac Companion.app/Contents/MacOS/IRISCompanion" --verify-review-fixtures'
      - name: Verify reversible cleanup, cancellation and encrypted protocol
        run: |
          swift build --product IRISCoreChecks
          check_binary="$(swift build --show-bin-path)/IRISCoreChecks"
          # This is the runner's newly compiled test executable, not the release app.
          codesign --verify --verbose=4 "$check_binary" || true
          xattr -l "$check_binary"
          codesign --force --sign - "$check_binary"
          codesign --verify --strict --verbose=2 "$check_binary"
          "$check_binary"
